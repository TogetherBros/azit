# 운영 EC2 의 /opt/azit 에서 돌아가는 구성. (server + caddy)
# GitHub Actions 가 배포할 때 이 파일, Caddyfile, server.env 를 /opt/azit 에 올리고
# docker compose up -d 를 한다.
#
# /opt/azit 에 생기는 파일
#   docker-compose.yml, caddy/Caddyfile  저장소의 deploy/ 에서 복사
#   server.env                      GitHub Secrets 로 Actions 가 만듦 (서버 비밀값)
#   .env                            AZIT_IMAGE=이번에 배포할 이미지 태그 (compose 변수)

services:
  server:
    image: ${AZIT_IMAGE:-ghcr.io/togetherbros/azit-server:latest}
    restart: unless-stopped
    env_file: server.env
    environment:
      PORT: "8081"
      # WAL: 읽기와 쓰기가 서로 덜 막힘. busy_timeout: 잠겨 있으면 바로 에러 말고 5초까지 기다림.
      DB_DSN: "/data/azit.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
    volumes:
      - azit-data:/data
    # 8081 은 밖으로 열지 않는다. 같은 compose 네트워크 안의 caddy 만 접근한다.
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    # 위키랑 메모리를 나눠 쓰는 서버라 상한을 둔다.
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    # 80 은 위키가 쓰고 있어서 443 만 연다. (UDP 443 은 HTTP/3)
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      # 파일 하나가 아니라 폴더로 붙여야, 배포 때 Caddyfile 을 바꾸고 reload 하면 새 내용이 보인다.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    mem_limit: 128m
    logging: *logging

volumes:
  azit-data:    # SQLite DB(azit.db). 컨테이너를 새로 만들어도 남는다.
  caddy-data:   # 발급받은 인증서
  caddy-config:

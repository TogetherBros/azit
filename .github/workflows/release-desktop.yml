# 데스크톱 앱 릴리스: v 로 시작하는 태그를 push 하면 3개 OS 로 빌드해서 배포한다.
#
#   git tag -a v0.2.0 -m "고친 것: ..."      # -m 내용이 앱의 업데이트 창에 그대로 보인다
#   git push origin v0.2.0
#
# 1) Windows / macOS / Linux 각자 그 OS 의 러너에서 빌드 (Wails 는 OS 별 웹뷰를 써서 각자 빌드해야 함)
#    - Windows: 설치 파일(NSIS, 관리자 권한 없이 내 계정에 설치)
#    - macOS:   Intel + Apple Silicon 겸용 .app 을 zip 으로
#    - Linux:   AppImage (실행 권한 주고 바로 실행)
# 2) 운영 EC2 의 /opt/azit/downloads 에 설치 파일과 latest.json 을 올림
#    → https://api.togetherbros.uk/download/ 에서 받기, 앱은 latest.json 을 보고 업데이트 창을 띄움
# 3) GitHub Releases 에도 같은 파일을 남김 (기록용)
#
# 버전은 태그 하나가 기준이다. 빌드 직전에 version.go 와 build/config.yml 에 태그 값을 넣는다.
# 시크릿은 deploy-server 와 같은 EC2_HOST, EC2_SSH_KEY, EC2_KNOWN_HOSTS 를 쓴다.

name: release-desktop

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release 만들기

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: darwin
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: 버전 넣기
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i.bak "s/^const appVersion = .*/const appVersion = \"$VERSION\"/" version.go
          sed -i.bak "s/^  version: .*/  version: \"$VERSION\"/" build/config.yml
          rm -f version.go.bak build/config.yml.bak
          grep -n appVersion version.go

      - name: wails3 설치 (go.mod 의 Wails 버전과 맞춤)
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"

      - name: Linux 빌드 도구
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2t64

      - name: Windows 설치 파일 도구 (NSIS)
        if: matrix.target == 'windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      # config.yml 의 이름·버전으로 Info.plist, 설치 파일 정보 등을 다시 만든다
      - name: 빌드 정보 갱신
        run: wails3 task common:update:build-assets

      - name: 빌드와 패키징
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            windows)
              wails3 task windows:create:nsis:installer INSTALL_SCOPE=user
              cp bin/*-installer.exe dist/azit-windows-setup.exe
              ;;
            darwin)
              wails3 task darwin:package:universal
              ditto -c -k --keepParent bin/azit.app dist/azit-mac.zip
              ;;
            linux)
              wails3 task linux:create:appimage
              cp bin/*.AppImage dist/azit-linux.AppImage
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: azit-${{ matrix.target }}
          path: desktop/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      EC2_USER: ec2-user
      DOWNLOAD_DIR: /opt/azit/downloads
      BASE_URL: https://api.togetherbros.uk/download
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: latest.json 만들기
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # annotated 태그(-m)의 내용을 업데이트 안내 문구로 쓴다. 없으면 빈 문자열.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d')
          # 파일 이름이 버전마다 같아서, 주소 뒤에 ?v= 를 붙여 브라우저 캐시를 피한다
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg b "$BASE_URL" '{
            version: $v,
            notes: $n,
            files: {
              windows: "\($b)/azit-windows-setup.exe?v=\($v)",
              darwin:  "\($b)/azit-mac.zip?v=\($v)",
              linux:   "\($b)/azit-linux.AppImage?v=\($v)"
            }
          }' > dist/latest.json
          cat dist/latest.json
          ls -la dist

      - name: SSH 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host ec2\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "${{ secrets.EC2_HOST }}" "$EC2_USER" > ~/.ssh/config

      # 설치 파일을 먼저 올리고 latest.json 을 마지막에 바꾼다.
      # 그래야 앱이 새 버전을 알았을 때 파일이 이미 받을 수 있는 상태다.
      - name: EC2 에 올리기
        run: |
          ssh ec2 "mkdir -p $DOWNLOAD_DIR"
          scp dist/azit-windows-setup.exe dist/azit-mac.zip dist/azit-linux.AppImage "ec2:$DOWNLOAD_DIR/"
          scp dist/latest.json "ec2:$DOWNLOAD_DIR/latest.json.new"
          ssh ec2 "mv $DOWNLOAD_DIR/latest.json.new $DOWNLOAD_DIR/latest.json"
          curl -fsS "$BASE_URL/latest.json"

      - name: GitHub Release 남기기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/azit-* --title "$GITHUB_REF_NAME" --notes-from-tag \
            || gh release upload "$GITHUB_REF_NAME" dist/azit-* --clobber

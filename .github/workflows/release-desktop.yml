# 데스크톱 앱 릴리스: v 로 시작하는 태그를 push 하면 3개 OS 로 빌드해서 GitHub Release 로 배포한다.
#
#   git tag -a v0.2.0 -m "고친 것: ..."      # -m 내용이 릴리스 설명과 앱의 업데이트 창에 그대로 보인다
#   git push origin v0.2.0
#
# 1) Windows / macOS / Linux 각자 그 OS 의 러너에서 빌드 (Wails 는 OS 별 웹뷰를 써서 각자 빌드해야 함)
#    - Windows: 설치 파일(NSIS, 관리자 권한 없이 내 계정에 설치)
#    - macOS:   Intel + Apple Silicon 겸용 .app 을 zip 으로
#    - Linux:   AppImage (실행 권한 주고 바로 실행)
# 2) GitHub Release 에 올림. 파일 이름이 항상 같아서 아래 주소가 늘 최신 버전을 가리킨다.
#      https://github.com/TogetherBros/azit/releases/latest/download/azit-windows-setup.exe
#      https://github.com/TogetherBros/azit/releases/latest/download/azit-mac.zip
#      https://github.com/TogetherBros/azit/releases/latest/download/azit-linux.AppImage
#      https://github.com/TogetherBros/azit/releases/latest/download/latest.json  ← 앱이 업데이트 확인에 씀
#
# 버전은 태그 하나가 기준이다. 빌드 직전에 version.go 와 build/config.yml 에 태그 값을 넣는다.

name: release-desktop

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release 만들기

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: darwin
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # 프론트(frontend/dist)는 Wails 빌드 태스크가 Go 빌드 전에 먼저 만든다.
      # main.go 에 //go:embed 가 없으면 화면 파일이 exe 에 안 들어가서 빈 창이 뜨니, 빌드 전에 막는다.
      - name: 화면 파일 embed 확인
        run: |
          grep -q '^//go:embed all:frontend/dist' main.go \
            || { echo "main.go 에 //go:embed all:frontend/dist 가 없어요. 이대로면 빈 창이 떠요."; exit 1; }

      - name: 버전 넣기
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i.bak "s/^const appVersion = .*/const appVersion = \"$VERSION\"/" version.go
          sed -i.bak "s/^  version: .*/  version: \"$VERSION\"/" build/config.yml
          rm -f version.go.bak build/config.yml.bak
          grep -n appVersion version.go

      # wails3 CLI 자체도 리눅스에선 GTK 헤더가 있어야 컴파일돼서, wails3 설치보다 먼저 깐다.
      - name: Linux 빌드 도구
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          # Wails v3 는 리눅스에서 GTK4 + WebKitGTK 6.0 을 쓴다
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libfuse2t64

      - name: wails3 설치 (go.mod 의 Wails 버전과 맞춤)
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"

      - name: Windows 설치 파일 도구 (NSIS)
        if: matrix.target == 'windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      # config.yml 의 이름·버전으로 Info.plist, 설치 파일 정보 등을 다시 만든다
      - name: 빌드 정보 갱신
        run: wails3 task common:update:build-assets

      - name: 빌드와 패키징
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            windows)
              wails3 task windows:create:nsis:installer INSTALL_SCOPE=user
              cp bin/*-installer.exe dist/azit-windows-setup.exe
              ;;
            darwin)
              wails3 task darwin:package:universal
              ditto -c -k --keepParent bin/azit.app dist/azit-mac.zip
              ;;
            linux)
              wails3 task linux:create:appimage
              cp bin/*.AppImage dist/azit-linux.AppImage
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: azit-${{ matrix.target }}
          path: desktop/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: latest.json 만들기
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # annotated 태그(-m)의 내용을 업데이트 안내 문구로 쓴다. 없으면 빈 문자열.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d')
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg b "$BASE" '{
            version: $v,
            notes: $n,
            files: {
              windows: "\($b)/azit-windows-setup.exe",
              darwin:  "\($b)/azit-mac.zip",
              linux:   "\($b)/azit-linux.AppImage"
            }
          }' > dist/latest.json
          cat dist/latest.json
          ls -la dist

      # draft 가 아닌 정식 릴리스로 만들어야 releases/latest 가 이 버전을 가리킨다.
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "아지트 $GITHUB_REF_NAME" --notes-from-tag --latest \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
